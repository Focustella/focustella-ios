name: ✨ Feature
description: 신규 기능, UX 개선, 제품 아이디어를 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Issue
        제품 요구사항에 가까운 형태로 작성하는 템플릿입니다.  
        문제 정의, 목표, 범위, 완료 조건을 적어주면 구현 단위로 쪼개기 쉽습니다.

  - type: textarea
    id: problem
    attributes:
      label: 😵 문제 정의
      description: 현재 어떤 문제가 있고 왜 개선이 필요한지 적어주세요.
      placeholder: 예) MySky 배경이 단조로워 브랜드 톤을 충분히 전달하지 못합니다.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 🎯 목표
      description: 이 기능으로 달성하려는 사용자 가치나 제품 목표를 적어주세요.
      placeholder: 예) 사용자가 더 몰입감 있는 밤하늘을 경험하도록 한다.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 🛠️ 제안 내용
      description: 원하는 동작, 화면, API, 정책을 구체적으로 적어주세요.
      placeholder: |
        - 원하는 UX:
        - 주요 동작:
        - 필요한 화면/API:
      render: markdown
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 📦 범위
      description: 이번 이슈에 포함할 것과 제외할 것을 구분해주세요.
      placeholder: |
        포함:
        - ...

        제외:
        - ...
      render: markdown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 대안 검토
      description: 고려했던 다른 방식이나 트레이드오프가 있다면 적어주세요.
      placeholder: |
        - 대안 A:
        - 대안 B:
        - 채택/비채택 이유:

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: ✅ 완료 조건
      description: 리뷰/QA 기준이 될 수 있도록 체크 가능한 형태로 작성해주세요.
      placeholder: |
        - [ ] 특정 화면에서 새 기능이 동작한다.
        - [ ] 회귀 없이 기존 플로우가 유지된다.
        - [ ] 설정/문서/로그가 필요한 경우 반영된다.
      render: markdown
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 📎 참고 자료
      description: 디자인, API 스펙, 노션 문서, 관련 이슈 링크 등을 적어주세요.
      placeholder: 링크, 스크린샷, 문서 경로를 붙여주세요.

  - type: checkboxes
    id: checklist
    attributes:
      label: ☑️ 체크리스트
      options:
        - label: 기존 이슈/기능과 중복되지 않는지 확인했습니다.
        - label: 문제 정의와 완료 조건을 구체적으로 작성했습니다.
        - label: 필요한 참고 자료를 첨부했습니다.
