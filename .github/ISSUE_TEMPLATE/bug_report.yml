name: 🛠️ Fix
description: 재현 가능한 문제, 회귀, 장애성 이슈를 등록합니다.
title: "[Fix] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🛠️ Fix Issue
        운영/개발 중 확인된 문제를 기록하는 템플릿입니다.  
        재현 정보와 영향 범위를 구체적으로 적어주면 우선순위 판단과 원인 분석이 빨라집니다.

  - type: textarea
    id: summary
    attributes:
      label: ✨ 개요
      description: 문제를 한두 문장으로 명확하게 설명해주세요.
      placeholder: 예) 집중 세션 종료 후 마지막 별 생성 이펙트가 표시되지 않습니다.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 심각도
      description: 사용자 영향도 기준으로 선택해주세요.
      options:
        - S1 - 서비스 사용 불가 / 크래시
        - S2 - 핵심 기능 장애
        - S3 - 우회 가능한 기능 문제
        - S4 - 경미한 UI/문구 문제
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: 🔁 회귀 여부
      description: 이전에는 정상 동작했는지 선택해주세요.
      options:
        - 예
        - 아니오
        - 확인 필요
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🧪 실행 환경
      description: 디바이스, OS, 앱 버전, 브랜치/커밋 등 재현 환경을 적어주세요.
      placeholder: |
        - Device: iPhone 16 Pro / Simulator
        - OS: iOS 26.2
        - App Version: 1.0.0
        - Branch/Commit: feature/...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🪜 재현 절차
      description: 재현 가능한 순서대로 작성해주세요.
      placeholder: |
        1. MySky 화면 진입
        2. 집중 세션 시작
        3. 마지막 별이 생성될 때까지 진행
        4. 이펙트 미표시 확인
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ 기대 동작
      placeholder: 예) 마지막 별 생성 시 이전 별과 동일한 생성 이펙트가 표시되어야 합니다.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: ❌ 실제 동작
      placeholder: 예) 마지막 별만 생성 이펙트 없이 바로 렌더링됩니다.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: 📌 영향 범위
      description: 사용자 영향, 비즈니스 영향, 다른 기능 연관 여부를 적어주세요.
      placeholder: |
        - 사용자 영향:
        - 영향 화면/기능:
        - 다른 세션/배경/디바이스에서도 동일한지:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📎 로그 / 스크린샷 / 참고 자료
      description: 콘솔 로그, 에러 메시지, 캡처 화면, 영상, 링크를 첨부해주세요.
      placeholder: 관련 로그와 자료를 붙여주세요.
      render: shell

  - type: textarea
    id: suspected_scope
    attributes:
      label: 🔍 원인 추정 또는 확인한 범위
      description: 이미 확인한 파일, 의심 지점, 제외한 가설이 있다면 적어주세요.
      placeholder: |
        - 의심 파일:
        - 확인한 내용:
        - 제외한 가설:

  - type: checkboxes
    id: checklist
    attributes:
      label: ☑️ 체크리스트
      options:
        - label: 중복 이슈가 없는지 확인했습니다.
        - label: 재현 절차를 직접 검증했습니다.
        - label: 로그/스크린샷 등 확인 자료를 첨부했습니다.
